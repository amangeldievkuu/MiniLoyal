# Dashboard and API on one origin. A TLS proxy (caddy or certbot nginx) in front of this
# container says https in X-Forwarded-Proto; the API marks cookies Secure only for https.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 8m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types application/json application/javascript application/manifest+json text/css image/svg+xml;
  gzip_min_length 1024;

  # API, LINE webhooks and health on the same origin, so dashboard cookies stay first-party.
  location ~ ^/(v1|webhooks|healthz|readyz)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app shell names the current hashed assets, so it is always revalidated.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Single-page app: every other path is the app shell.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
