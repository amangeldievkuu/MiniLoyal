  # --------------------------------------------------------- member auth
  /v1/auth/line:
    post:
      tags: [member-auth]
      operationId: loginWithLine
      summary: Exchange a LIFF ID token for a member session
      description: |
        The MINI App sends the ID token from liff.getIDToken(). The token is
        verified against LINE's JWKS (ES256) or the channel secret (HS256);
        its audience must be one of the app's configured channel IDs. The
        member is created on first sign-in. Sessions last one hour; the SDK
        exchanges a fresh ID token when one expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineLoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The ID token is invalid, expired or for another channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or disabled app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      tags: [member]
      operationId: getMe
      summary: The signed-in member
      security:
        - memberSession: []
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [member]
      operationId: updateMe
      summary: Update profile fields
      security:
        - memberSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
    delete:
      tags: [member]
      operationId: deleteMe
      summary: Erase my personal data
      description: |
        PDPA erasure. Personal fields are blanked in place so points and
        coupon history stay consistent; the LINE account can register again
        as a new member. The session ends.
      security:
        - memberSession: []
      responses:
        '204':
          description: Erased
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/consent:
    post:
      tags: [member]
      operationId: recordConsent
      summary: Record consent to the current personal-data notice
      security:
        - memberSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Member with consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/me/export:
    get:
      tags: [member]
      operationId: exportMe
      summary: Everything stored about me
      description: PDPA access right. A machine-readable copy of the member's data.
      security:
        - memberSession: []
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------ webhooks
  /webhooks/line/{appId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags: [webhooks]
      operationId: receiveLineWebhook
      summary: Inbound webhook from the app's LINE Official Account
      description: |
        Configure this URL in the Messaging API channel of the brand's
        Official Account. The body is the raw LINE webhook payload and is
        verified with X-Line-Signature (HMAC-SHA256 over the raw body with
        the channel secret). Events are deduplicated by webhookEventId and
        redeliveries are honoured. follow and unfollow update the member's
        friend status. Always answers within one second.
      parameters:
        - name: X-Line-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
        '401':
          description: Bad signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------- dashboard members
  /v1/dashboard/apps/{appId}/members:
    parameters:
