openapi: 3.0.3
info:
  title: MiniLoyal API
  version: 0.5.0
  description: |
    Membership and loyalty backend for LINE MINI Apps: LINE login, member
    cards, points, coupons, stamp cards, messaging and webhooks.

    Authentication:
    - dashboardSession: JWT for dashboard users (15 minutes). Refresh tokens
      travel in an httpOnly cookie scoped to /v1/dashboard/auth.
    - apiKey: server key (prefix ml_) for brand backends and POS systems,
      sent as X-API-Key.
    - memberSession and staffSession arrive with the member and staff APIs.

    Every write endpoint outside /v1/dashboard/auth requires an
    Idempotency-Key header. Errors use the Error envelope.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
    description: Liveness and readiness
  - name: dashboard-auth
    description: Dashboard sign-in, sessions and multi-factor authentication
  - name: dashboard-me
    description: The signed-in dashboard user
  - name: tenants
    description: Tenants (agencies and brands) and their teams
  - name: apps
    description: Apps (one LINE MINI App each) and their LINE channels
  - name: stores
    description: Stores and branches used for staff redemption
  - name: staff
    description: Store staff who scan member cards
  - name: api-keys
    description: Server API keys for brand backends and POS systems
  - name: audit
    description: Audit log of admin and staff actions
  - name: server
    description: Server-to-server API (API key)
  - name: member-auth
    description: MINI App member sign-in through LINE
  - name: member
    description: The signed-in MINI App member
  - name: members
    description: Members as seen by the dashboard and the server API
  - name: webhooks
    description: Inbound LINE webhooks
  - name: invitations
    description: Team invitations
  - name: security
    description: Account security history
  - name: points
    description: Points rules, balances, history and adjustments
  - name: staff-app
    description: The cashier app (LIFF) used in stores
  - name: coupons
    description: Coupon templates, claims, issues, redemption and voids
  - name: stamps
    description: Stamp cards, progress, stamps and adjustments
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness probe
      description: The process is up and serving requests.
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe
      description: The process can reach its database.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------------- auth
  /v1/dashboard/auth/register:
    post:
      tags: [dashboard-auth]
      operationId: dashboardRegister
      summary: Create a dashboard account and its first tenant
      description: |
        Creates the user, a tenant on the free plan and an owner membership,
        then signs the user in. Sets the refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/dashboard/auth/login:
    post:
      tags: [dashboard-auth]
      operationId: dashboardLogin
      summary: Sign in with email and password
      description: |
        Returns a session, or an MFA challenge when the account has TOTP
        enabled. Wrong credentials answer 401 without saying which part was
        wrong. Sets the refresh cookie when a session is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session or MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/dashboard/auth/mfa:
    post:
      tags: [dashboard-auth]
      operationId: dashboardMfa
      summary: Complete sign-in with a TOTP or recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/dashboard/auth/refresh:
    post:
      tags: [dashboard-auth]
      operationId: dashboardRefresh
      summary: Exchange the refresh cookie for a new session
      description: |
        Rotates the refresh token. Reusing an already rotated token revokes
        the whole token family, except for a bounded number of lost
        responses (see the auth service).
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/dashboard/auth/logout:
    post:
      tags: [dashboard-auth]
      operationId: dashboardLogout
      summary: Sign out this device
      description: Revokes the refresh token in the cookie and clears it.
      responses:
        '204':
          description: Signed out

  # ------------------------------------------------------------------- me
  /v1/dashboard/me:
    get:
      tags: [dashboard-me]
      operationId: getDashboardMe
      summary: The signed-in user and their tenant memberships
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/dashboard/me/password:
    post:
      tags: [dashboard-me]
      operationId: changeDashboardPassword
      summary: Change the password and end every other session
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: New session for this device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/dashboard/me/logout-all:
    post:
      tags: [dashboard-me]
      operationId: dashboardLogoutAll
      summary: Sign out everywhere
      description: Invalidates every access token and refresh token of the account.
      security:
        - dashboardSession: []
      responses:
        '204':
          description: Signed out everywhere
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/dashboard/me/totp/enroll:
    post:
      tags: [dashboard-me]
      operationId: enrollTotp
      summary: Start TOTP enrollment
      description: |
        Returns a new secret and otpauth URL. Nothing changes until the
        code is confirmed. Calling again replaces the pending secret.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Pending enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: TOTP is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/dashboard/me/totp/confirm:
    post:
      tags: [dashboard-me]
      operationId: confirmTotp
      summary: Confirm TOTP enrollment with a code
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: TOTP enabled; recovery codes shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No pending enrollment, or already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/dashboard/me/totp:
    delete:
      tags: [dashboard-me]
      operationId: disableTotp
      summary: Disable TOTP
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '204':
          description: Disabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Password or code is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # -------------------------------------------------------------- tenants
  /v1/dashboard/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: Tenants the signed-in user belongs to
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Tenants with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/dashboard/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Tenant details
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tenants]
      operationId: updateTenant
      summary: Rename the tenant
      description: Owners and admins only.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/tenants/{tenantId}/team:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: listTeam
      summary: Team members of the tenant
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dashboard/tenants/{tenantId}/team/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [tenants]
      operationId: updateTeamMember
      summary: Change a team member's role
      description: Owners only. The last owner cannot be demoted.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Would leave the tenant without an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
    delete:
      tags: [tenants]
      operationId: removeTeamMember
      summary: Remove a team member
      description: Owners and admins; admins cannot remove owners. The last owner cannot be removed.
      security:
        - dashboardSession: []
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Would leave the tenant without an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/dashboard/tenants/{tenantId}/audit-log:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Audit log, newest first
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: app_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- apps
  /v1/dashboard/tenants/{tenantId}/apps:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [apps]
      operationId: listApps
      summary: Apps of the tenant
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [apps]
      operationId: createApp
      summary: Create an app
      description: One app is one LINE MINI App. Owners and admins only. Plan limits apply.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug already used in this tenant, or plan limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/apps/{appId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [apps]
      operationId: getApp
      summary: App details
      security:
        - dashboardSession: []
      responses:
        '200':
          description: App
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [apps]
      operationId: updateApp
      summary: Update app settings and LINE Official Account credentials
      description: |
        Owners and admins only. The OA channel secret is write-only and is
        stored encrypted; the response only says whether one is set.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/apps/{appId}/channels:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [apps]
      operationId: listAppChannels
      summary: LINE MINI App channels of the app
      description: One entry per internal channel (developing, review, published).
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dashboard/apps/{appId}/channels/{environment}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ChannelEnvironment'
    put:
      tags: [apps]
      operationId: putAppChannel
      summary: Create or replace the channel for an environment
      description: Owners and admins only. The channel secret is write-only and stored encrypted.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppChannelPut'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
    delete:
      tags: [apps]
      operationId: deleteAppChannel
      summary: Remove the channel for an environment
      security:
        - dashboardSession: []
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- stores
  /v1/dashboard/apps/{appId}/stores:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [stores]
      operationId: listStores
      summary: Stores of the app
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [stores]
      operationId: createStore
      summary: Create a store
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Store code already used in this app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/stores/{storeId}:
    parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [stores]
      operationId: updateStore
      summary: Update a store
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
    delete:
      tags: [stores]
      operationId: deleteStore
      summary: Delete a store
      description: Fails while staff are still assigned to it.
      security:
        - dashboardSession: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Staff are still assigned to this store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- staff
  /v1/dashboard/apps/{appId}/staff:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [staff]
      operationId: listStaff
      summary: Staff of the app
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [staff]
      operationId: createStaff
      summary: Add a staff member
      description: |
        Staff sign in to the staff app with LINE later; the LINE user ID is
        bound on first login using the invite code returned here.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Created, with a one-time invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
