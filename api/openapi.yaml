          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [coupons]
      operationId: createCouponTemplate
      summary: Create a coupon template
      description: |
        Owners and admins only; audited. value is checked against type:
        amount_off takes 1 or more currency units, percent_off 1 to 100,
        free_item 0 (name the item in name or description). valid_to must be
        after valid_from when both are set.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponTemplateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/coupon-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/CouponTemplateId'
    get:
      tags: [coupons]
      operationId: getCouponTemplate
      summary: A coupon template
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [coupons]
      operationId: updateCouponTemplate
      summary: Change or archive a coupon template
      description: |
        Owners and admins only; audited. Templates are never deleted, since
        coupons refer to them: set status archived to stop new claims and
        issues. Coupons already issued stay redeemable until they expire.
        An archived template can be made active again.

        Once a coupon has been issued from the template (claimed_count above
        zero), type and value are fixed (409 coupon_template_in_use), so a
        coupon never changes what it is worth after the member got it.
        total_limit cannot go below claimed_count (409
        coupon_template_in_use). Changes to the validity window, validity_days
        and per_member_limit apply to coupons issued from then on; expires_at
        of issued coupons does not move.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponTemplateUpdate'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: coupon_template_in_use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'

