  /v1/dashboard/members/{memberId}/coupons:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [coupons]
      operationId: listMemberCoupons
      summary: A member's coupons, newest first
      description: Every coupon including voided ones; filter with state.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/CouponStateFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of coupons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInstancePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [coupons]
      operationId: issueMemberCoupon
      summary: Give a member a coupon from a template
      description: |
        Owners and admins only; audited. Issues with source issue, whatever
        the template's claimable flag and per_member_limit; total_limit still
        applies (409 coupon_sold_out). The template must be in the member's
        app (404 otherwise), active and inside its validity window (409
        coupon_not_claimable otherwise).
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponIssueRequest'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: coupon_not_claimable or coupon_sold_out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/coupons/{instanceId}/void:
    parameters:
      - $ref: '#/components/parameters/CouponInstanceId'
    post:
      tags: [coupons]
      operationId: voidCoupon
      summary: Void a member's coupon
      description: |
        Owners and admins only; audited with the reason. Only an issued
        coupon can be voided, expired or not; a redeemed or already voided
        coupon answers 409 coupon_unavailable. Voiding does not give the
        template's total_limit back.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponVoidRequest'
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: coupon_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/members/{memberId}/stamps:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [stamps]
      operationId: listMemberStamps
      summary: A member's stamp card progress
      description: |
        One entry per stamp card of the app that is active or that the member
        has progress on, archived cards included.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Progress per card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StampProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dashboard/members/{memberId}/stamps/adjustments:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [stamps]
      operationId: adjustMemberStamps
      summary: Correct a member's stamps
      description: |
        Owners and admins only; audited. Writes a new stamp event; earlier
        events are never changed. A positive delta that reaches
        stamps_required completes the card and issues the reward, as a staff
        stamp would. A negative delta cannot take the count below zero (409
        insufficient_stamps) and does not undo past completions or their
        rewards (void the reward coupon instead). The per-visit cap does not
        apply; archived cards can be corrected.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StampAdjustment'
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StampResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: insufficient_stamps or coupon_sold_out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'

  # ------------------------------------------------------------------ server coupons
  /v1/members/{memberId}/coupons:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [server, coupons]
      operationId: serverListMemberCoupons
      summary: A member's coupons (API key, members:read)
      description: Every coupon including voided ones, newest first; filter with state.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/CouponStateFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of coupons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInstancePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [server, coupons]
      operationId: serverIssueCoupon
      summary: Give a member a coupon from a POS or brand backend (API key, coupons:write)
      description: |
        Same rules as the dashboard issue: source issue, claimable and
        per_member_limit ignored, total_limit applies (409 coupon_sold_out),
        template active and inside its validity window (409
        coupon_not_claimable).
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponIssueRequest'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: coupon_not_claimable or coupon_sold_out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      required: false
      description: Search text; matches the display name or an exact LINE user ID.
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen unique key per logical write (UUID recommended). Repeating a key with the same payload returns the original response; a different payload returns 422.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelEnvironment:
      name: environment
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ChannelEnvironment'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
    CouponTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CouponInstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StampCardId:
      name: stampCardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberCouponFilter:
      name: state
      in: query
      required: false
      description: available (issued, not expired), used (redeemed) or expired. Omitted, every coupon except voided ones.
      schema:
        type: string
        enum: [available, used, expired]
    CouponStateFilter:
      name: state
      in: query
      required: false
      description: Only coupons in this effective state. Omitted, every coupon.
      schema:
        $ref: '#/components/schemas/CouponState'
    TemplateStatusFilter:
      name: status
      in: query
      required: false
      description: Only active or only archived entries. Omitted, both.
      schema:
        $ref: '#/components/schemas/ArchiveStatus'
  responses:
    BadRequest:
      description: Malformed request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller's role does not allow this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not visible to this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded; retry after the Retry-After seconds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyMismatch:
      description: Idempotency-Key was already used with a different payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    memberSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Health:
      type: object
      required: [status, version, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: '0.1.0'
        uptime_seconds:
          type: integer
          format: int64
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example bad_request, unauthorized, forbidden, not_found, conflict, idempotency_mismatch, rate_limited, unavailable, internal.
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true

    # ---- auth
    RegisterRequest:
      type: object
      required: [email, password, tenant_name, tenant_type]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 200
        display_name:
          type: string
          maxLength: 100
        tenant_name:
          type: string
          minLength: 1
          maxLength: 100
        tenant_type:
          $ref: '#/components/schemas/TenantType'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 200
    LoginResult:
      type: object
      description: Exactly one of session or mfa is present.
      properties:
        session:
          $ref: '#/components/schemas/Session'
        mfa:
          $ref: '#/components/schemas/MfaChallenge'
    MfaChallenge:
      type: object
      required: [mfa_token, expires_in]
      properties:
        mfa_token:
          type: string
          description: Short-lived token proving the password step; send it with the code.
        expires_in:
          type: integer
          description: Seconds until the challenge expires.
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
        code:
          type: string
          description: Six-digit TOTP code or a recovery code.
          minLength: 6
          maxLength: 32
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, totp_enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        totp_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    Me:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 200
        new_password:
          type: string
          minLength: 10
          maxLength: 200
    TotpEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32 secret, for manual entry.
        otpauth_url:
          type: string
          description: otpauth:// URL to render as a QR code.
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    TotpConfirmed:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Shown once. Each code works a single time.
          items:
            type: string
    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          maxLength: 200
        code:
          type: string
          minLength: 6
          maxLength: 32

    # ---- tenants
    TenantType:
      type: string
      enum: [brand, agency]
    Role:
      type: string
      enum: [owner, admin, staff]
      description: owner manages everything including billing and the team; admin manages apps and settings; staff has read-only access in the dashboard.
    Tenant:
      type: object
      required: [id, type, name, slug, plan, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TenantType'
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: free, starter, pro, agency or enterprise.
        parent_tenant_id:
          type: string
          format: uuid
          nullable: true
          description: The agency that manages this brand, if any.
        created_at:
          type: string
          format: date-time
    TenantUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    Membership:
      type: object
      required: [tenant, role]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        role:
          $ref: '#/components/schemas/Role'
    TeamMember:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
    TeamMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    # ---- apps
    AppStatus:
      type: string
      enum: [active, disabled]
    ChannelEnvironment:
      type: string
      enum: [developing, review, published, staff]
      description: |
        developing, review and published are the three internal channels of
        the LINE MINI App channel. staff is the staff app's own LINE Login
        channel (same provider); staff sign-in accepts only it and member
        sign-in never does, so its channel ID must differ from the MINI App's.
    App:
      type: object
      required:
        [
          id,
          tenant_id,
          name,
          slug,
          locale,
          status,
          oa_channel_secret_set,
          webhook_url,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        locale:
          type: string
          description: BCP 47 tag used for member-facing defaults, for example zh-TW.
        status:
          $ref: '#/components/schemas/AppStatus'
        oa_channel_id:
          type: string
          nullable: true
          description: Messaging API channel ID of the brand's LINE Official Account.
        oa_basic_id:
          type: string
          nullable: true
          description: The Official Account's basic ID, for example @123abcd, used for add-friend links.
        oa_channel_secret_set:
          type: boolean
        oa_verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the Official Account credentials were last verified against LINE.
        webhook_url:
          type: string
          description: The URL to configure as the Messaging API webhook for this app.
        allow_hs256_id_tokens:
          type: boolean
          description: Accept HS256 ID tokens (LINE web login). LIFF issues ES256, so this stays off for MINI Apps.
        member_sessions_valid_from:
          type: string
          format: date-time
          nullable: true
          description: Member sessions issued before this instant are refused.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
          description: URL-safe identifier, derived from the name when omitted.
        locale:
          type: string
          default: zh-TW
          maxLength: 16
    AppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        locale:
          type: string
          maxLength: 16
        status:
          $ref: '#/components/schemas/AppStatus'
        oa_channel_id:
          type: string
          maxLength: 32
          nullable: true
        oa_basic_id:
          type: string
          maxLength: 32
          nullable: true
        oa_channel_secret:
          type: string
          writeOnly: true
          maxLength: 128
          description: Stored encrypted. Send an empty string to clear it.
        allow_hs256_id_tokens:
          type: boolean
    AppChannel:
      type: object
      required: [environment, channel_id, liff_id, channel_secret_set, verified_at, created_at]
      properties:
        environment:
          $ref: '#/components/schemas/ChannelEnvironment'
        channel_id:
          type: string
          description: LINE MINI App channel ID; the ID token audience.
        liff_id:
          type: string
          description: LIFF ID of this internal channel.
        channel_secret_set:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the channel credentials were last verified against LINE.
        created_at:
          type: string
          format: date-time
    AppChannelPut:
      type: object
      required: [channel_id, liff_id, channel_secret]
      properties:
        channel_id:
          type: string
          minLength: 1
          maxLength: 32
        liff_id:
          type: string
          minLength: 1
          maxLength: 64
        channel_secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
          description: Proves control of the channel (a token is minted with it) and verifies HS256 tokens; stored encrypted.

    # ---- stores
    Store:
      type: object
      required: [id, app_id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          nullable: true
          description: Short code shown to staff, unique within the app.
        address:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AppStatus'
        created_at:
          type: string
          format: date-time
    StoreCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 300
    StoreUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          maxLength: 32
          nullable: true
        address:
          type: string
          maxLength: 300
          nullable: true
        status:
          $ref: '#/components/schemas/AppStatus'

    # ---- staff
    StaffRole:
      type: string
      enum: [cashier, manager]
    Staff:
      type: object
      required: [id, app_id, display_name, role, status, line_linked, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
          nullable: true
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/AppStatus'
        line_linked:
          type: boolean
          description: Whether the staff member has signed in to the staff app with LINE.
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    StaffCreate:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        store_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/StaffRole'
    StaffCreated:
      allOf:
        - $ref: '#/components/schemas/Staff'
        - type: object
          required: [invite_code]
          properties:
            invite_code:
              type: string
              description: One-time code the staff member enters in the staff app to bind their LINE account. Shown once.
    StaffUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        store_id:
          type: string
          format: uuid
          nullable: true
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/AppStatus'

    # ---- api keys
    ApiKeyScope:
      type: string
      enum:
        - members:read
        - members:write
        - points:write
        - coupons:write
        - messages:send
        - webhooks:manage
        - config:read
    ApiKey:
      type: object
      required: [id, app_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, to recognise it.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApiKeyScope'
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full key. Shown once; only its hash is stored.

    # ---- audit
    AuditActorType:
      type: string
      enum: [user, staff, api_key, system]
    AuditEntry:
      type: object
      required: [id, actor_type, action, target_type, created_at]
      properties:
        id:
          type: integer
          format: int64
        app_id:
          type: string
          format: uuid
          nullable: true
        actor_type:
          $ref: '#/components/schemas/AuditActorType'
        actor_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          description: Dotted verb, for example app.update, api_key.create, team.remove.
        target_type:
          type: string
        target_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
          nullable: true

    # ---- members
    Gender:
      type: string
      enum: [female, male, other]
    Consent:
      type: object
      required: [version, accepted_at]
      properties:
        version:
          type: string
        accepted_at:
          type: string
          format: date-time
    Member:
      type: object
      required: [id, app_id, is_friend, custom_fields, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          description: The member's LINE language, when LINE shared it.
        is_friend:
          type: boolean
          description: Whether the member currently follows the brand's Official Account.
        phone:
          type: string
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        custom_fields:
          type: object
          additionalProperties: true
        consent:
          $ref: '#/components/schemas/Consent'
        created_at:
          type: string
          format: date-time
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          required: [created_at, updated_at]
          properties:
            line_user_id:
              type: string
              description: Omitted for dashboard users with the staff role, like phone and birthday.
            friend_changed_at:
              type: string
              format: date-time
              nullable: true
            last_login_at:
              type: string
              format: date-time
              nullable: true
            updated_at:
              type: string
              format: date-time
    MemberUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 32
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        custom_fields:
          type: object
          additionalProperties: true
          description: Brand-defined fields; replaces the stored object. At most 32 keys and 8 KiB.
    ConsentRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Identifier of the personal-data notice the member accepted, for example 2026-11.
    MemberExport:
      type: object
      required: [member, consents, exported_at]
      properties:
        member:
          $ref: '#/components/schemas/MemberDetail'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
        exported_at:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberDetail'
        next_cursor:
          type: string
          nullable: true
    LineLoginRequest:
      type: object
      required: [app_id, id_token]
      properties:
        app_id:
          type: string
          format: uuid
        id_token:
          type: string
          minLength: 20
          maxLength: 4096
        nonce:
          type: string
          maxLength: 255
          description: The nonce passed to liff.login(), when one was used.
        liff_access_token:
          type: string
          maxLength: 4096
          description: liff.getAccessToken(), kept for service messages once the MINI App is verified.
        language:
          type: string
          maxLength: 16
          description: liff.getLanguage(), a BCP 47 tag used for member-facing messages.
    AppPublic:
      type: object
      description: What a MINI App may know about its own app.
      required: [id, name, locale]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        locale:
          type: string
        oa_basic_id:
          type: string
          nullable: true
          description: The Official Account's basic ID (for example @123abcd) for the add-friend prompt.
    MemberSession:
      type: object
      required: [session_token, token_type, expires_in, member, app, is_new]
      properties:
        app:
          $ref: '#/components/schemas/AppPublic'
        session_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the session token expires.
        member:
          $ref: '#/components/schemas/Member'
        is_new:
          type: boolean
          description: True when this sign-in created the member.

    # ---- invitations and security events
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InvitationCreate:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [invite_url]
          properties:
            invite_url:
              type: string
              description: The link to send to the invitee. Shown once; only its hash is stored.
    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 255
        password:
          type: string
          minLength: 10
          maxLength: 200
          description: Required when the invited email has no account yet. Ignored for existing accounts, which must be signed in instead.
        display_name:
          type: string
          maxLength: 100
    SecurityEvent:
      type: object
      required: [id, event, created_at]
      properties:
        id:
          type: integer
          format: int64
        event:
          type: string
          description: Dotted name, for example login.success, login.mfa_failed, password.changed, totp.enabled, sessions.ended, refresh.replayed.
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    SecurityEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEvent'
        next_cursor:
          type: string
          nullable: true

    # ---- member card and points
    MemberCard:
      type: object
      required: [qr, expires_at, refresh_in_seconds, window_seconds]
      properties:
        qr:
          type: string
          description: Opaque payload to render as a QR code.
        expires_at:
          type: string
          format: date-time
        refresh_in_seconds:
          type: integer
        window_seconds:
          type: integer
    MemberCardRotated:
      type: object
      required: [qr_key_version]
      properties:
        qr_key_version:
          type: integer
    PointsKind:
      type: string
      enum: [earn, redeem, adjust, expire]
    PointsExpiring:
      type: object
      required: [points, expires_at]
      properties:
        points:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
    PointsRulesPublic:
      type: object
      required: [currency, spend_per_point, points_per_unit, enabled]
      properties:
        currency:
          type: string
        spend_per_point:
          type: integer
        points_per_unit:
          type: integer
        expiry_days:
          type: integer
          nullable: true
        enabled:
          type: boolean
    PointsSummary:
      type: object
      required: [member_id, balance, lifetime_earned, expiring, rules]
      properties:
        member_id:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
        lifetime_earned:
          type: integer
          format: int64
        expiring:
          type: array
          description: The next (at most three) expiry dates with the points that expire then.
          items:
            $ref: '#/components/schemas/PointsExpiring'
        rules:
          $ref: '#/components/schemas/PointsRulesPublic'
    PointsTransaction:
      type: object
      required: [id, member_id, kind, points, balance_after, actor_type, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The transaction; one transaction may touch several lots.
        member_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PointsKind'
        points:
          type: integer
          format: int64
          description: Signed change, positive for earn.
        balance_after:
          type: integer
          format: int64
        spend_amount:
          type: integer
          nullable: true
        ref_type:
          type: string
          nullable: true
        ref_id:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        store_id:
          type: string
          format: uuid
          nullable: true
        actor_type:
          type: string
          enum: [member, staff, user, api_key, system]
        created_at:
          type: string
          format: date-time
    PointsHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PointsTransaction'
        next_cursor:
          type: string
          nullable: true
    PointsRules:
      allOf:
        - $ref: '#/components/schemas/PointsRulesPut'
        - type: object
          properties:
            updated_at:
              type: string
              format: date-time
              nullable: true
    PointsRulesPut:
      type: object
      required: [currency, spend_per_point, points_per_unit, min_spend, enabled]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: TWD
        spend_per_point:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Currency units spent for points_per_unit points.
        points_per_unit:
          type: integer
          minimum: 1
          maximum: 1000
        min_spend:
          type: integer
          minimum: 0
          maximum: 10000000
        max_points_per_txn:
          type: integer
          minimum: 1
          maximum: 1000000
          nullable: true
        expiry_days:
          type: integer
          minimum: 1
          maximum: 3650
          nullable: true
          description: Points expire this many days after they are earned; null keeps them forever.
        enabled:
          type: boolean
    PointsAdjustment:
      type: object
      required: [delta, note]
      properties:
        delta:
          type: integer
          minimum: -1000000
          maximum: 1000000
          description: Non-zero.
        note:
          type: string
          minLength: 1
          maxLength: 200
    ServerPointsRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [earn, redeem, adjust]
        points:
          type: integer
          minimum: -1000000
          maximum: 1000000
        spend_amount:
          type: integer
          minimum: 0
          maximum: 100000000
        ref_type:
          type: string
          maxLength: 32
        ref_id:
          type: string
          maxLength: 128
        note:
          type: string
          maxLength: 200

    # ---- staff app
    StaffLoginRequest:
      type: object
      required: [app_id, id_token]
      properties:
        app_id:
          type: string
          format: uuid
        id_token:
          type: string
          minLength: 20
          maxLength: 4096
        invite_code:
          type: string
          minLength: 8
          maxLength: 32
          description: From the dashboard, needed on the first sign-in only.
    StoreRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    StaffMe:
      type: object
      required: [id, app_id, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        store:
          $ref: '#/components/schemas/StoreRef'
    StaffSession:
      type: object
      required: [session_token, token_type, expires_in, staff, app]
      properties:
        session_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        staff:
          $ref: '#/components/schemas/StaffMe'
        app:
          $ref: '#/components/schemas/AppPublic'
    ScanRequest:
      type: object
      required: [qr]
      properties:
        qr:
          type: string
          minLength: 10
          maxLength: 128
    ScannedMember:
      type: object
      required: [id, is_friend]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        is_friend:
          type: boolean
    ScanResult:
      type: object
      required: [scan_token, expires_at, member, balance, coupons, stamps]
      description: Carries no personal data beyond ScannedMember, whatever the staff role.
      properties:
        scan_token:
          type: string
          description: Authorizes points, coupon and stamp actions on this member for five minutes; it pays for at most one points redemption.
        expires_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/ScannedMember'
        balance:
          type: integer
          format: int64
        coupons:
          type: array
          description: The member's coupons staff can redeem now (state available), soonest expiry first, at most 50.
          maxItems: 50
          items:
            $ref: '#/components/schemas/CouponInstance'
        stamps:
          type: array
          description: The member's progress on every active stamp card of the app, zero for cards not started.
          items:
            $ref: '#/components/schemas/StampProgress'
    StaffEarnRequest:
      type: object
      required: [scan_token]
      properties:
        scan_token:
          type: string
          maxLength: 1024
        spend_amount:
          type: integer
          minimum: 0
          maximum: 100000000
        points:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Managers only; replaces the rule calculation.
        note:
          type: string
          maxLength: 200
    StaffRedeemRequest:
      type: object
      required: [scan_token, points]
      properties:
        scan_token:
          type: string
          maxLength: 1024
        points:
          type: integer
          minimum: 1
          maximum: 1000000
        note:
          type: string
          maxLength: 200

    # ---- coupons
    ArchiveStatus:
      type: string
      enum: [active, archived]
      description: Archived coupon templates and stamp cards stop new claims, issues and stamps; nothing is deleted.
    CouponType:
      type: string
      enum: [amount_off, percent_off, free_item]
      description: amount_off takes value currency units off, percent_off takes value percent off, free_item gives the item named in the template.
    CouponInstanceStatus:
      type: string
      enum: [issued, redeemed, voided]
      description: Stored status. Expiry is not a stored status; see CouponState.
    CouponState:
      type: string
      enum: [available, redeemed, expired, voided]
      description: Effective state. available is issued and not past expires_at; expired is issued and past it.
    CouponSource:
      type: string
      enum: [claim, issue, stamp_reward]
      description: claim by the member, issue from the dashboard or server API, stamp_reward on completing a stamp card.
    CouponTemplateClearable:
      type: string
      enum: [description, total_limit, valid_from, valid_to, validity_days]
    CouponTemplate:
      type: object
      required:
        [
          id,
          app_id,
          name,
          type,
          value,
          per_member_limit,
          claimable,
          claimed_count,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Template ID; members claim with it.
        app_id:
          type: string
          format: uuid
          description: The app the template belongs to.
        name:
          type: string
          description: Shown to members and staff, for example "NT$50 off".
        description:
          type: string
          nullable: true
          description: Terms shown to members.
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          description: Currency units for amount_off, percent for percent_off, 0 for free_item.
        total_limit:
          type: integer
          nullable: true
          description: Most coupons ever issued from the template, from every source; null for no limit.
        per_member_limit:
          type: integer
          description: Most coupons one member may hold from member claims (voided ones excluded). Dashboard, API and stamp reward issues ignore it.
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Claims and issues are refused before this time; null for no start.
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Claims and issues are refused from this time, and coupons expire at it at the latest; null for no end.
        validity_days:
          type: integer
          nullable: true
          description: A coupon expires this many days after it was issued, or at valid_to if that is earlier; null for no relative expiry.
        claimable:
          type: boolean
          description: Whether members may claim it themselves. False for issue-only and stamp reward templates.
        claimed_count:
          type: integer
          description: Coupons issued so far from every source (claim, issue, stamp_reward); counts toward total_limit. Voids do not lower it.
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        created_at:
          type: string
          format: date-time
          description: When the template was created.
        updated_at:
          type: string
          format: date-time
          description: When the template last changed.
    CouponTemplateCreate:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown to members and staff.
        description:
          type: string
          maxLength: 500
          description: Terms shown to members.
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          minimum: 0
          maximum: 1000000
          description: amount_off 1 or more currency units, percent_off 1 to 100, free_item 0.
        total_limit:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Most coupons ever issued; omit for no limit.
        per_member_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Most coupons one member may hold from claims.
        valid_from:
          type: string
          format: date-time
          description: No claims or issues before this time.
        valid_to:
          type: string
          format: date-time
          description: No claims or issues from this time; coupons expire at it at the latest. Must be after valid_from.
        validity_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Coupons expire this many days after issue (or at valid_to if earlier).
        claimable:
          type: boolean
          default: false
          description: Let members claim it from the offers list. Leave false for reward and issue-only templates.
    CouponTemplateUpdate:
      type: object
      description: Only the fields sent change. Fields listed in clear are set to null; a field may not be both sent and cleared.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown to members and staff.
        description:
          type: string
          maxLength: 500
          description: Terms shown to members.
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Fixed once claimed_count is above zero.
        total_limit:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Cannot go below claimed_count.
        per_member_limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applies to claims from now on.
        valid_from:
          type: string
          format: date-time
          description: Applies to claims and issues from now on.
        valid_to:
          type: string
          format: date-time
          description: Applies to claims and issues from now on; issued coupons keep their expires_at.
        validity_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Applies to coupons issued from now on.
        claimable:
          type: boolean
          description: Let members claim it from the offers list.
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        clear:
          type: array
          maxItems: 5
          uniqueItems: true
          description: Fields to reset to null (no limit, no window, no description).
          items:
            $ref: '#/components/schemas/CouponTemplateClearable'
    CouponTemplateSummary:
      type: object
      required: [id, name, type, value]
      properties:
        id:
          type: string
          format: uuid
          description: Template ID.
        name:
          type: string
          description: Template name.
        description:
          type: string
          nullable: true
          description: Terms shown to members.
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          description: Currency units for amount_off, percent for percent_off, 0 for free_item.
    CouponOffer:
      type: object
      required: [template, per_member_limit, held, can_claim]
      properties:
        template:
          $ref: '#/components/schemas/CouponTemplateSummary'
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Last moment to claim; also the latest expiry of a claimed coupon.
        validity_days:
          type: integer
          nullable: true
          description: A claimed coupon expires this many days after the claim, or at valid_to if earlier.
        per_member_limit:
          type: integer
          description: Most coupons the member may hold from this offer.
        held:
          type: integer
          description: Coupons the member already holds from this template, voided ones excluded.
        can_claim:
          type: boolean
          description: False when held has reached per_member_limit.
    CouponInstance:
      type: object
      required: [id, code, template, member_id, status, state, source, issued_at]
      properties:
        id:
          type: string
          format: uuid
          description: Coupon ID; staff redeem with it.
        code:
          type: string
          description: Short code unique within the app, for receipts and support. Not a credential; redeeming needs a scan of the member card.
        template:
          $ref: '#/components/schemas/CouponTemplateSummary'
        member_id:
          type: string
          format: uuid
          description: The member holding the coupon.
        status:
          $ref: '#/components/schemas/CouponInstanceStatus'
        state:
          $ref: '#/components/schemas/CouponState'
        source:
          $ref: '#/components/schemas/CouponSource'
        issued_at:
          type: string
          format: date-time
          description: When the member got the coupon.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Fixed at issue; null when the coupon never expires. Redeeming at or after this time fails.
        redeemed_at:
          type: string
          format: date-time
          nullable: true
          description: When staff redeemed it.
        store:
          $ref: '#/components/schemas/StoreRef'
    CouponInstancePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Coupons, newest first.
          items:
            $ref: '#/components/schemas/CouponInstance'
        next_cursor:
          type: string
          nullable: true
          description: Pass as cursor for the next page; null on the last page.
    CouponIssueRequest:
      type: object
      required: [template_id]
      properties:
        template_id:
          type: string
          format: uuid
          description: Template of the member's app to issue from.
    CouponVoidRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Why the coupon is voided; kept in the audit log.
    StaffCouponRedeemRequest:
      type: object
      required: [scan_token]
      properties:
        scan_token:
          type: string
          maxLength: 1024
          description: From a scan of the coupon holder's card in the last five minutes.

    # ---- stamps
    StampCardClearable:
      type: string
      enum: [reward_coupon_template_id]
    StampCard:
      type: object
      required:
        [id, app_id, name, stamps_required, max_stamps_per_visit, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Stamp card ID.
        app_id:
          type: string
          format: uuid
          description: The app the card belongs to.
        name:
          type: string
          description: Shown to members and staff.
        stamps_required:
          type: integer
          description: Stamps that complete the card.
        reward_coupon_template_id:
          type: string
          format: uuid
          nullable: true
          description: Template issued on each completion; null for no reward coupon.
        max_stamps_per_visit:
          type: integer
          description: Most stamps staff may give on one scan.
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        created_at:
          type: string
          format: date-time
          description: When the card was created.
        updated_at:
          type: string
          format: date-time
          description: When the card last changed.
    StampCardCreate:
      type: object
      required: [name, stamps_required]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown to members and staff.
        stamps_required:
          type: integer
          minimum: 2
          maximum: 100
          description: Stamps that complete the card.
        reward_coupon_template_id:
          type: string
          format: uuid
          description: Template of the same app issued on each completion.
        max_stamps_per_visit:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Most stamps staff may give on one scan.
    StampCardUpdate:
      type: object
      description: Only the fields sent change. Fields listed in clear are set to null; a field may not be both sent and cleared.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown to members and staff.
        stamps_required:
          type: integer
          minimum: 2
          maximum: 100
          description: Fixed once any member has a stamp on the card.
        reward_coupon_template_id:
          type: string
          format: uuid
          description: Applies to completions from now on.
        max_stamps_per_visit:
          type: integer
          minimum: 1
          maximum: 100
          description: Most stamps staff may give on one scan.
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        clear:
          type: array
          maxItems: 1
          uniqueItems: true
          description: Fields to reset to null (no reward coupon).
          items:
            $ref: '#/components/schemas/StampCardClearable'
    StampProgress:
      type: object
      required:
        [stamp_card_id, name, stamps_required, max_stamps_per_visit, status, count, completions]
      properties:
        stamp_card_id:
          type: string
          format: uuid
          description: The stamp card.
        name:
          type: string
          description: Card name.
        stamps_required:
          type: integer
          description: Stamps that complete the card.
        max_stamps_per_visit:
          type: integer
          description: Most stamps staff may give on one scan.
        status:
          $ref: '#/components/schemas/ArchiveStatus'
        count:
          type: integer
          description: Stamps toward the next completion, from 0 to stamps_required minus 1.
        completions:
          type: integer
          description: Times the member completed the card.
        reward:
          $ref: '#/components/schemas/CouponTemplateSummary'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last stamp or adjustment; null when the member has no stamps on the card yet.
    StampResult:
      type: object
      required: [progress, added, completed, rewards]
      properties:
        progress:
          $ref: '#/components/schemas/StampProgress'
        added:
          type: integer
          description: Signed change applied by this request.
        completed:
          type: integer
          description: Completions this request caused.
        rewards:
          type: array
          description: Reward coupons issued by those completions; empty when there were none or the card has no reward.
          items:
            $ref: '#/components/schemas/CouponInstance'
    StaffStampRequest:
      type: object
      required: [scan_token, stamp_card_id, count]
      properties:
        scan_token:
          type: string
          maxLength: 1024
          description: From a scan of the member card in the last five minutes.
        stamp_card_id:
          type: string
          format: uuid
          description: Card of the staff member's app.
        count:
          type: integer
          minimum: 1
          maximum: 100
          description: Stamps to add; at most the card's max_stamps_per_visit, counting stamps already given on this scan.
    StampAdjustment:
      type: object
      required: [stamp_card_id, delta, note]
      properties:
        stamp_card_id:
          type: string
          format: uuid
          description: Card of the member's app.
        delta:
          type: integer
          minimum: -100
          maximum: 100
          description: Non-zero.
        note:
          type: string
          minLength: 1
          maxLength: 200
          description: Why; kept in the audit log.
