  # ---------------------------------------------------------- invitations
  /v1/dashboard/tenants/{tenantId}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Pending invitations
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite someone to the team
      description: |
        Returns the invitation link once; share it with the invitee. Owners
        grant any role, admins grant admin or staff. One pending invitation
        per email per tenant. Accepting the link creates the membership.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already a member, or an invitation is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      security:
        - dashboardSession: []
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dashboard/auth/accept-invite:
    post:
      tags: [dashboard-auth]
      operationId: acceptInvitation
      summary: Accept an invitation link
      description: |
        Creates the account when the invited email has none yet (password
        required), adds the membership and signs the user in. An email that
        already has an account must be signed in as that account (send its
        dashboard bearer token); a password is never accepted for it, so the
        link cannot bypass TOTP. Sets the refresh cookie.
      security:
        - {}
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid, expired or already used invitation, or (code sign_in_required) the invited email has an account and the caller is not signed in as it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/dashboard/me/security-events:
    get:
      tags: [security]
      operationId: listSecurityEvents
      summary: My account security history, newest first
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------- member card and points
  /v1/me/card:
    get:
      tags: [member]
      operationId: getMyCard
      summary: The member card QR code, valid for one 30-second window
      description: |
        Returns the current rotating QR payload. Render it as a QR code and
        fetch again after refresh_in_seconds. A scanner accepts the code until
        expires_at (its window plus one), so a screenshot stops working within
        90 seconds.
      security:
        - memberSession: []
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/points:
    get:
      tags: [member, points]
      operationId: getMyPoints
      summary: My points balance, what expires soon, and the earn rule
      security:
        - memberSession: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/points/history:
    get:
      tags: [member, points]
      operationId: listMyPointsHistory
      summary: My points transactions, newest first
      description: |
        Members see what happened, not the brand's internal notes: note and
        ref_id are omitted here (they are present in the dashboard and server
        API history).
      security:
        - memberSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------------- staff app
  /v1/staff/auth/line:
    post:
      tags: [staff-app]
      operationId: staffLoginWithLine
      summary: Sign in to the staff app with LINE
      description: |
        The staff app sends a LIFF ID token. The first sign-in also sends the
        invite code from the dashboard, which binds the LINE account to the
        staff record; later sign-ins need only the token. Invite codes are
        matched within the app only and attempts are rate limited. Staff
        sessions last 12 hours (one shift).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid ID token, unknown staff member or wrong invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/staff/me:
    get:
      tags: [staff-app]
      operationId: getStaffMe
      summary: The signed-in staff member
      security:
        - staffSession: []
      responses:
        '200':
          description: Staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/staff/scan:
    post:
      tags: [staff-app]
      operationId: staffScan
      summary: Read a member card QR code
      description: |
        Verifies the rotating code and returns the member with a scan token,
        the coupons staff can redeem and the stamp card progress. Points,
        coupon and stamp actions require the scan token, so staff can only
        act on a member whose card they scanned in the last five minutes.
        Reading a code changes nothing, so no Idempotency-Key.
      security:
        - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: Member found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The code is malformed, expired (a screenshot) or for another app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/staff/points/earn:
    post:
      tags: [staff-app, points]
      operationId: staffEarnPoints
      summary: Give points for a purchase
      description: |
        Points come from the app's earn rule applied to spend_amount. Managers
        may instead give a fixed number of points, within the rule's cap;
        cashiers may not. Staff cannot act on their own member card (403
        self_service), and each staff member may make 30 points writes a
        minute (429). A retry with the same Idempotency-Key replays the stored
        result even after the scan token expired; a new write needs a scan
        made in the last five minutes (403 scan_invalid otherwise).
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffEarnRequest'
      responses:
        '200':
          description: Points added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/staff/points/redeem:
    post:
      tags: [staff-app, points]
      operationId: staffRedeemPoints
      summary: Spend a member's points
      description: |
        One scan pays for at most one redemption (409 scan_used afterwards;
        scan the card again). The same rules as earn apply to own cards, the
        rate limit, retries and expired scans.
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRedeemRequest'
      responses:
        '200':
          description: Points spent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Not enough points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'

  # ------------------------------------------------------------------ dashboard points
  /v1/dashboard/apps/{appId}/points-rules:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [points]
      operationId: getPointsRules
      summary: The app's earn rule
      description: |
        Apps without a saved rule answer the defaults (NT$100 = 1 point, at
        most 10,000 points per purchase, no expiry). Whatever the rule, one
        purchase or fixed grant earns at most 100,000 points.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [points]
      operationId: putPointsRules
      summary: Replace the app's earn rule
      description: Owners and admins only. Applies to points earned from now on.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointsRulesPut'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
  /v1/dashboard/members/{memberId}/points:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [points]
      operationId: getMemberPoints
      summary: A member's points summary
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dashboard/members/{memberId}/points/history:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [points]
      operationId: listMemberPointsHistory
      summary: A member's points transactions, newest first
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
